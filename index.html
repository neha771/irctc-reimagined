<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IRCTC · Book train tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* =========================================================
   Tokens: lavender page, violet gradient, white cards, large type
   ========================================================= */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --sunk:#ECEFF6; --ink:#121A33; --muted:#566079; --line:#E0E4EF; --line-2:#C7CFE2;
  --primary:#2443B5; --on-primary:#FFFFFF; --primary-soft:#E6ECFC; --primary-text:#1F3BA3;
  --cta:#F4B400; --on-cta:#14204A;
  --grad:linear-gradient(120deg,#0F1A44 0%,#1E3A93 45%,#3B5CCC 80%,#7E95E4 100%);
  --sky-front:rgba(35,26,96,.85); --sky-back:rgba(255,255,255,.13);
  --ok:#0F7A47; --ok-soft:#E3F5EB; --warn:#9A5B00; --warn-soft:#FFF2DB; --bad:#C0352B; --bad-soft:#FDEBE9;
  --focus:#3B82F6; --shadow:0 2px 6px rgba(20,32,74,.05),0 14px 36px rgba(20,32,74,.08);
  --font:'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs:16px; --lh:1.45; --ls:0; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="hc"]){
  --bg:#0B0F1D; --surface:#141A2E; --sunk:#10162A; --ink:#E9EDF8; --muted:#A5AEC6; --line:#252D47; --line-2:#37415F;
  --primary:#8EA6FF; --on-primary:#0B1230; --primary-soft:#1C2648; --primary-text:#A9BCFF;
  --cta:#F5C542; --on-cta:#1A1606;
  --grad:linear-gradient(120deg,#070C20 0%,#14245E 50%,#2A45A6 100%); --sky-front:rgba(10,8,30,.85); --sky-back:rgba(255,255,255,.07);
  --ok:#6BD49A; --ok-soft:#10301F; --warn:#F3C063; --warn-soft:#33270F; --bad:#FF958A; --bad-soft:#3A1816;
  --focus:#93B4FF; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F1D; --surface:#141A2E; --sunk:#10162A; --ink:#E9EDF8; --muted:#A5AEC6; --line:#252D47; --line-2:#37415F;
  --primary:#8EA6FF; --on-primary:#0B1230; --primary-soft:#1C2648; --primary-text:#A9BCFF;
  --cta:#F5C542; --on-cta:#1A1606;
  --grad:linear-gradient(120deg,#070C20 0%,#14245E 50%,#2A45A6 100%); --sky-front:rgba(10,8,30,.85); --sky-back:rgba(255,255,255,.07);
  --ok:#6BD49A; --ok-soft:#10301F; --warn:#F3C063; --warn-soft:#33270F; --bad:#FF958A; --bad-soft:#3A1816;
  --focus:#93B4FF; --shadow:none; color-scheme:dark}
:root[data-theme="hc"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#FFFFFF; --ink:#000000; --muted:#000000; --line:#000000; --line-2:#000000;
  --primary:#000000; --on-primary:#FFFF00; --primary-soft:#FFFFFF; --primary-text:#000000; --cta:#000000; --on-cta:#FFFF00;
  --grad:#000000; --sky-front:#333333; --sky-back:rgba(255,255,255,.2);
  --ok:#000000; --ok-soft:#FFFFFF; --warn:#000000; --warn-soft:#FFFFFF; --bad:#000000; --bad-soft:#FFFFFF; --focus:#FF7A00; --shadow:none}
:root[data-theme="hc"] .card,:root[data-theme="hc"] .tcard,:root[data-theme="hc"] .pill,:root[data-theme="hc"] .chip,:root[data-theme="hc"] .opt,:root[data-theme="hc"] .person{border:2px solid #000!important}
:root.readable{--font:'Atkinson Hyperlegible','Noto Sans Devanagari',system-ui,sans-serif}
:root.spacing{--lh:1.85; --ls:.03em}
:root.calm *,:root.focus *{animation:none!important;transition:none!important}
:root.focus .optional{display:none!important}
:root.focus .btn,:root.focus .chip{min-height:58px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

*{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:var(--lh);letter-spacing:var(--ls);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.12;text-wrap:balance;letter-spacing:-.03em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-80px;z-index:200;background:var(--surface);color:var(--ink);border:2px solid var(--focus);padding:10px 14px;border-radius:10px}
.skip:focus{top:12px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}.small{font-size:.9rem}.tiny{font-size:.78rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}

/* =========================================================
   Header
   ========================================================= */
header.site{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
header.site .wrap{display:flex;align-items:center;gap:28px;height:76px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink)}
.logo i{width:42px;height:42px;border-radius:13px;background:var(--grad);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.9rem}
.logo b{font-weight:600;font-size:1.25rem;letter-spacing:.04em}
nav.main{display:flex;gap:4px}
nav.main button{background:none;border:0;padding:10px 16px;border-radius:999px;font-weight:500;font-size:1rem;color:var(--muted)}
nav.main button:hover{color:var(--ink);background:var(--sunk)}
nav.main button[aria-current="page"]{color:var(--primary-text);background:var(--primary-soft)}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.hbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:500}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center;font-weight:600;border:0}
@media (max-width:900px){nav.main{display:none}.hbtn .lbl{display:none}}

/* =========================================================
   Components
   ========================================================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 28px;border-radius:999px;border:0;font-weight:600;font-size:1.05rem;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 10px 24px rgba(36,67,181,.28)}
:root[data-theme="dark"] .btn-primary,:root[data-theme="hc"] .btn-primary{box-shadow:none}
.btn-cta{background:var(--cta);color:var(--on-cta);box-shadow:0 10px 24px rgba(244,180,0,.28)}
:root[data-theme="dark"] .btn-cta,:root[data-theme="hc"] .btn-cta{box-shadow:none}
.btn-cta:hover{filter:brightness(.97)}
.btn-white{background:#fff;color:#14204A}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-2)}
.btn-glass{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.btn-block{width:100%}
.btn-sm{min-height:42px;padding:0 18px;font-size:.95rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.link{background:none;border:0;padding:0;color:var(--primary-text);font-weight:600;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.pad{padding:22px 24px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--primary-soft);color:var(--primary-text)}
.lbl{font-size:.85rem;color:var(--muted);font-weight:500}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line-2);position:relative;flex:none;cursor:pointer;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw:checked{background:var(--primary)}.sw:checked::after{left:25px}
.swrow{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 0;cursor:pointer}
.swrow+.swrow{border-top:1px solid var(--line)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.bg-ok{background:var(--ok)}.bg-warn{background:var(--warn)}.bg-bad{background:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.9rem;font-weight:600}
.field input,.field select,.select{border:1.5px solid var(--line-2);background:var(--surface);border-radius:14px;padding:0 14px;min-height:52px;font-size:1rem}
.infoline{font-size:.95rem;display:flex;gap:12px;align-items:flex-start;background:var(--primary-soft);border-radius:18px;padding:14px 18px}
.infoline svg{flex:none;color:var(--primary-text);margin-top:2px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:300;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:500;max-width:90%;text-align:center}

/* =========================================================
   Hero + search
   ========================================================= */
.hero{position:relative;background:var(--grad);color:#fff;overflow:hidden}
.hero .photo{position:absolute;inset:0;background:url("assets/hero-train.webp") center 47%/cover no-repeat}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,22,58,.88) 0%,rgba(12,22,58,.6) 40%,rgba(12,22,58,.12) 78%,rgba(12,22,58,.05) 100%)}
.band .photo{background-position:center 46%}
.band .photo::after{background:linear-gradient(90deg,rgba(12,22,58,.9) 0%,rgba(12,22,58,.7) 50%,rgba(12,22,58,.35) 100%)}
:root[data-theme="hc"] .hero .photo{display:none}
.hero .wrap{position:relative;z-index:2}
.home-hero{padding:40px 0 118px}
.home-hero .k{font-size:1.05rem;font-weight:500;opacity:.85}
.home-hero h1{font-size:clamp(2.2rem,4vw,3.1rem);font-weight:600;letter-spacing:-.045em;margin-top:2px}
.home-hero h1 span{font-weight:400;opacity:.8}
.home-hero .s{font-size:1.05rem;opacity:.85;margin-top:4px}
.search{margin-top:-92px;position:relative;z-index:5;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr) minmax(0,.8fr) minmax(0,.8fr);gap:0;align-items:stretch;border:1.5px solid var(--line-2);border-radius:22px}
.sgrid>div{padding:10px 18px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.sgrid>div+div{border-left:1.5px solid var(--line)}
.sgrid .swapcell{padding:0;display:grid;place-items:center;border-left:0!important}
.sgrid .swapcell+div{border-left:0}
.sgrid input,.sgrid select,.sgrid .pick{border:0;background:transparent;font-size:1.25rem;letter-spacing:-.02em;font-weight:500;padding:2px 0;width:100%;min-width:0;text-align:left}
.sgrid input:focus,.sgrid select:focus{outline:none}
.sgrid>div:focus-within{box-shadow:inset 0 -3px 0 var(--primary)}
.sgrid .code{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.05em}
.swap{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);color:var(--primary-text);display:grid;place-items:center}
@media (max-width:980px){.sgrid{grid-template-columns:minmax(0,1fr)}.sgrid>div+div{border-left:0;border-top:1.5px solid var(--line)}.sgrid .swapcell{display:none}}
.srow{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}
.ask{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:10px;color:#fff;max-width:560px;margin-top:20px;width:100%;text-align:left}
.ask:hover{background:rgba(255,255,255,.18)}
.ask .orbi{width:46px;height:46px;border-radius:14px;flex:none;background:radial-gradient(circle at 30% 28%,#FFF7D6 0%,#F4B400 38%,#3B5CCC 78%,#1E3A93 100%);display:grid;place-items:center;color:#14204A}
.ask .q{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.ask .q b{font-weight:600}
.ask .q span{opacity:.82;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask .speak{display:inline-flex;align-items:center;gap:6px;background:var(--cta);color:var(--on-cta);border-radius:12px;padding:0 16px;min-height:44px;font-weight:600;flex:none}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:#1F3BA3;display:grid;place-items:center;flex:none}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0 28px}
@media (max-width:980px){.quick{grid-template-columns:minmax(0,1fr)}}
.qk{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);width:100%}
.qk:hover{border-color:var(--line-2)}
.qk .ic svg{width:20px;height:20px}
.qk .ic{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center;flex:none;font-weight:700}
.qk b{display:block;font-weight:600;letter-spacing:-.01em}
.qk span.d{font-size:.86rem;color:var(--muted)}
.qk .go{margin-left:auto;color:var(--primary-text);font-weight:600}

/* =========================================================
   Page band (inner pages)
   ========================================================= */
.band{padding:30px 0 64px}
.band h1{font-size:clamp(1.7rem,3vw,2.3rem);font-weight:600;letter-spacing:-.04em}
.band .s{opacity:.85;font-size:1rem;margin-top:4px}
.band .crumb{background:none;border:0;color:#fff;opacity:.85;padding:0;margin-bottom:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.lift{margin-top:-44px;position:relative;z-index:5}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start;margin-bottom:60px}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:96px}

/* results */
.dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:10px}
.dtile{border:1.5px solid transparent;background:var(--surface);border-radius:18px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.dtile b{font-size:1.4rem;font-weight:500;line-height:1.1}
.dtile .tiny{font-weight:500}
.dtile[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.dtile[aria-pressed="true"] .muted{color:inherit;opacity:.85}
.dtile:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:700px){.dates{grid-template-columns:repeat(4,minmax(0,1fr))}}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0 14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;min-height:44px;padding:0 18px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.list{display:flex;flex-direction:column;gap:14px}
.tcard{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr) auto;gap:24px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px 24px}
.tcard:hover{border-color:var(--line-2)}
.tcard.best{box-shadow:0 0 0 2px var(--primary),var(--shadow)}
@media (max-width:820px){.tcard{grid-template-columns:minmax(0,1fr)}}
.nm{font-weight:600;font-size:1.1rem}
.no{color:var(--muted);font-weight:400}
.tm-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;margin-top:10px}
.tm b{display:block;font-size:1.6rem;font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums}
.tm span{font-size:.8rem;color:var(--muted);font-weight:500;letter-spacing:.03em}
.tm.r{text-align:right}
.dur{text-align:center;font-size:.82rem;color:var(--muted)}
.dur .ln{display:flex;align-items:center;gap:4px;margin:4px 0}
.dur .ln i{flex:1;height:0;border-top:1.5px dashed var(--line-2)}
.dur .ln b{width:9px;height:9px;border-radius:50%;background:var(--primary)}
.dur .ln b.x{background:var(--warn)}
.price{font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--primary-text);text-align:right}
.price small{display:block;font-size:.76rem;color:var(--muted);font-weight:400}

/* detail */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:64px 18px minmax(0,1fr);gap:14px;align-items:start;padding-bottom:20px;position:relative}
.timeline li::after{content:"";position:absolute;left:87px;top:18px;bottom:0;width:2px;background:var(--line-2)}
.timeline li:last-child::after{display:none}
.timeline .t{font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums;text-align:right}
.timeline .d{width:16px;height:16px;border-radius:50%;border:3px solid var(--primary);background:var(--surface);margin-top:4px;z-index:1}
.chg{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:.92rem;display:block;margin-top:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:20px;padding:14px 18px;background:var(--surface);text-align:left;width:100%}
.opt[aria-checked="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset;background:var(--primary-soft)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.opt[aria-checked="true"] .rd{border-color:var(--primary)}
.opt[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}

/* travellers */
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.people{grid-template-columns:minmax(0,1fr)}}
.person{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface)}
.person[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.person.no{opacity:.55}
.person .top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.av{width:46px;height:46px;border-radius:50%;background:var(--sunk);color:var(--primary-text);display:grid;place-items:center;font-weight:600}
.person[aria-checked="true"] .av{background:var(--primary);color:var(--on-primary)}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent;font-size:.85rem;font-weight:700}
.person[aria-checked="true"] .tick{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* ticket */
.ticket{max-width:720px;margin:-60px auto 60px;position:relative;z-index:5}
.ticket .stub{border-top:2px dashed var(--line-2);position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.ticket .stub::before{left:-14px}.ticket .stub::after{right:-14px}
.pnr{font-size:2rem;font-weight:600;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.qr{width:150px;height:150px;background:#fff;border-radius:16px;padding:8px;border:1px solid var(--line)}

/* live */
.map{position:relative;height:520px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#E9EDF8,#F7F8FC);border:1px solid var(--line)}
:root[data-theme="dark"] .map{background:linear-gradient(180deg,#121A30,#0B0F1D)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="hc"]) .map{background:linear-gradient(180deg,#121A30,#0B0F1D)}}
:root[data-theme="hc"] .map{background:#fff;border:2px solid #000}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .mtop{position:absolute;bottom:16px;left:16px;z-index:2}
.stations{list-style:none;margin:0;padding:0}
.stations li{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 0;position:relative}
.stations li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--line-2)}
.stations li:first-child::before{top:50%}.stations li:last-child::before{bottom:50%}
.stations .dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--line-2);margin-left:5px;z-index:1}
.stations li.past .dot{background:var(--primary);border-color:var(--primary)}
.stations li.past::before{background:var(--primary)}
.stations li.now .dot{width:22px;height:22px;margin-left:0;background:var(--primary);border-color:var(--primary-soft);box-shadow:0 0 0 6px var(--primary-soft)}
.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%{opacity:.6;r:12}100%{opacity:0;r:30}}

/* dialogs, drawers, voice */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(10,18,48,.45);display:flex;justify-content:center;align-items:flex-start;padding:8vh 16px;overflow:auto;animation:fade .2s}
.scrim.right{justify-content:flex-end;align-items:stretch;padding:0}
.dialog{background:var(--surface);color:var(--ink);width:min(520px,100%);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:16px;animation:up .22s ease}
.drawer{background:var(--surface);color:var(--ink);width:min(480px,100%);height:100%;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:16px;animation:slide .22s ease}
.dialog h2,.drawer h2{font-size:1.6rem;font-weight:600}
.xbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none}
@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.voice{background:var(--grad);color:#fff;width:min(460px,100%);height:100%;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:16px;animation:slide .22s ease}
.voice .xbtn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}
.orb{width:170px;height:170px;flex:none;border-radius:50%;margin:16px auto 4px;background:radial-gradient(circle at 35% 30%,#FFF7D6 0%,#F4B400 24%,#6F87E0 56%,rgba(59,92,204,0) 72%);position:relative}
.orb::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:ring 1.6s infinite}
.orb.idle::after{animation:none;opacity:.3}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.voice .said{font-size:1.35rem;font-weight:400;letter-spacing:-.02em;text-align:center;min-height:2.2em}

.fab{position:fixed;right:28px;bottom:28px;z-index:60;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:8px 18px 8px 8px;font-weight:600;box-shadow:0 14px 34px rgba(20,32,74,.18)}
.fab[hidden],.tourbtn[hidden]{display:none}

.tourbtn{position:fixed;left:24px;bottom:28px;z-index:60;background:var(--surface);border:1.5px solid var(--line-2);border-radius:999px;padding:10px 18px;font-weight:600;box-shadow:var(--shadow)}
.tourpop{position:fixed;left:24px;bottom:84px;z-index:61;width:330px;padding:16px;display:flex;flex-direction:column;gap:6px}

footer.site{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}

  const lb=Math.max(5,Math.min(95,b.lb+Math.round(dl/2)));
  return{kind,n,p,fare:b.f,lb,tone:kind==='avl'?'ok':tone(p),label:kind==='avl'?`Available ${n}`:`Waitlist ${n}`,word:kind==='avl'?'Confirmed now':`${p}% chance to confirm`};
}
function visible(){
  let L=TRAINS.filter(x=>Object.keys(x.cls).some(c=>stat(x,c)));
  const counts={all:L.length,direct:L.filter(x=>!x.conn).length,conn:L.filter(x=>x.conn).length};
  if(S.rtab==='direct')L=L.filter(x=>!x.conn);if(S.rtab==='conn')L=L.filter(x=>x.conn);
  const classes=['1A','2A','3A','SL'].filter(c=>L.some(x=>stat(x,c)));
  if(!classes.includes(S.cls))S.cls=classes.includes('3A')?'3A':classes[0];
  const withCls=L.filter(x=>stat(x,S.cls));
  const senior=S.auth&&S.pax.some(id=>eligSS(person(id)));
  const sc={best:x=>{const s=stat(x,S.cls);return -(s.p/100*.6+(senior?s.lb/100*.25:0)+(1-(x.mins-2100)/1300)*.15)},early:x=>x.dep[0],fast:x=>x.mins,cheap:x=>stat(x,S.cls).fare,sure:x=>-stat(x,S.cls).p};
  withCls.sort((a,b)=>{const A=sc[S.sort](a),B=sc[S.sort](b);return A<B?-1:A>B?1:0});
  return{list:withCls,counts,classes,missing:L.length-withCls.length};
}

  if(SR){try{voiceRec=new SR();voiceRec.lang='en-IN';voiceRec.interimResults=true;
    voiceRec.onresult=e=>{const r=[...e.results].map(x=>x[0].transcript).join(' ');$('#vsaid').textContent=r;if(e.results[e.results.length-1].isFinal)handleSpeech(r)};
    voiceRec.onerror=()=>idle('Microphone not available here. Tap a phrase or type.');voiceRec.onend=()=>{$('#orb')&&$('#orb').classList.add('idle')};voiceRec.start()}catch(e){idle('Tap a phrase or type to try the assistant.')}}
  else idle('Tap a phrase or type to try the assistant.');
}
function typeOut(text,done){const el=$('#vsaid');el.textContent='';let i=0;$('#orb').classList.remove('idle');const iv=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(iv);done()}},26)}
function parseTrip(low){
  const out={};const found=[];Object.keys(ALIAS).forEach(k=>{const i=low.indexOf(k);if(i>=0&&!found.some(f=>f.c===ALIAS[k]))found.push({i,c:ALIAS[k]})});found.sort((a,b)=>a.i-b.i);
  if(found.length>=2){out.from=found[0].c;out.to=found[1].c}else if(found.length===1)out.to=found[0].c;
  if(/tatkal/.test(low))out.quota='TQ';else if(/lower berth|senior|parents/.test(low))out.quota='SS';else if(/ladies|women/.test(low))out.quota='LD';
  if(/sleeper|\bsl\b/.test(low))out.cls='SL';else if(/3ac|3 ac|3a\b|third ac/.test(low))out.cls='3A';else if(/2ac|2 ac|2a\b/.test(low))out.cls='2A';
  let pax=['me'];if(/dad|father|papa/.test(low))pax.push('dad');if(/mom|mother|maa/.test(low))pax.push('mom');if(/parents/.test(low))pax=['mom','dad'];if(/friend|arjun/.test(low))pax.push('arj');out.pax=pax;
  DAYS.forEach((d,i)=>{const w=d.toLocaleDateString('en-IN',{weekday:'long'}).toLowerCase();if(low.includes(w))out.date=i});if(/tomorrow|kal/.test(low))out.date=0;
  if(/cheap|sasta/.test(low))out.sort='cheap';
  return out;
}
function handleSpeech(text){
  const low=' '+text.toLowerCase()+' ';const sg=$('#vsugg');if(sg)sg.hidden=true;$('#orb').classList.add('idle');$('#vstatus').textContent='';
  let html,speak;
  if(/where|location|running|live|late/.test(low)){speak=`${LIVE.name} is between ${LIVE.stations[LIVE.now-1][0]} and ${LIVE.stations[LIVE.now][0]}, running ${LIVE.late} minutes late. It reaches ${LIVE.stations[LIVE.now][0]} at ${LIVE.stations[LIVE.now][2]}.`;html=`<p>${speak}</p><button class="btn btn-primary btn-block" data-vgo="live">Open live map</button>`}
  else if(/pnr|status|waitlist/.test(low)){const t=S.trips[0];speak=`${t.name} on ${t.date} is at ${t.st}, with a ${t.p} percent chance to confirm.`;html=`<p>${speak}</p><button class="btn btn-primary btn-block" data-vgo="trips">See my trip</button>`}
  else{
    const p=parseTrip(low);if(p.from)S.from=p.from;if(p.to)S.to=p.to;const sample=S.from==='Bengaluru'&&S.to==='Patna';if(!sample){S.from='Bengaluru';S.to='Patna'}
    S.auth=true;S.pax=p.pax;S.quota=p.quota||'GN';if(p.cls)S.cls=p.cls;if(p.sort)S.sort=p.sort;S.date=S.quota==='TQ'?TK.idx:(p.date!=null?p.date:S.date);S.rtab='all';
    const v=visible(),top=v.list[0],s=top&&stat(top,S.cls);const who=S.pax.map(id=>id==='me'?'you':person(id).rel.toLowerCase()).join(' and ');
    if(S.quota==='TQ'&&top){speak=`Tatkal for ${fd(TK.travel)} opens at 10 AM. ${top.name} in ${CLS[S.cls][0]} has the best chance, ${s.p} percent. I can auto-book it for ${who}, with a backup.`;html=`<p>${speak}</p><div class="row"><button class="btn btn-primary btn-sm" data-vgo="tatkal:${top.id}">Set up auto-book</button><button class="btn btn-ghost btn-sm" data-vgo="results">See all trains</button></div>`}
    else if(top){speak=`I found ${v.list.length} options in ${CLS[S.cls][0]} for ${fd(DAYS[S.date])}${v.counts.conn&&S.quota==='GN'?`, including ${v.counts.conn} with one change`:''}. Best for ${who}: ${top.name}, ${s.label.toLowerCase()}, ${R(s.fare)} each.`;html=`<p>${speak}</p>${S.quota==='SS'?'<p class="small muted">Using the lower-berth quota, since both your parents qualify.</p>':''}<div class="row"><button class="btn btn-primary btn-sm" data-vgo="results">Show trains</button><button class="btn btn-ghost btn-sm" data-vgo="detail:${top.id}">Open best option</button></div>`}
    else{speak='I couldn’t find seats for that. Try another class or date.';html=`<p>${speak}</p><button class="btn btn-primary btn-block" data-vgo="results">Show trains</button>`}
    if(!sample)html=`<p class="small muted">Sample data covers Bengaluru → Patna, so I used that route.</p>`+html;
  }
  $('#vreply').innerHTML=`<div class="reply" role="status">${html}</div>`;
  if(A.speak&&window.speechSynthesis){try{const u=new SpeechSynthesisUtterance(speak);u.lang='en-IN';speechSynthesis.speak(u)}catch(e){}}
}
function tourPop(open){
  const b=$('#tourbtn');b.setAttribute('aria-expanded',open);const old=$('#tourpop');if(old)old.remove();if(!open)return;
  const items=[['welcome','Guest visit, then sign in'],['connecting','Search and connecting trains'],['waitlist','Book on waitlist with a chance'],['senior','Lower-berth quota for parents'],['tatkal','Tatkal auto-book'],['live','Where’s my train'],['voice','Talk to the assistant'],['a11y','Accessibility settings']];
  const d=document.createElement('div');d.className='card tourpop';d.id='tourpop';d.setAttribute('role','menu');
  d.innerHTML=`<p class="lbl" style="padding:4px 10px">Jump to a flow</p>`+items.map(([k,l],i)=>`<button role="menuitem" data-tour="${k}"><span class="n">${i+1}</span>${l}</button>`).join('');
  document.body.appendChild(d);d.querySelector('button').focus();
}

/* =========================================================
   Render & navigation
   ========================================================= */
let liveTimer=null,cdTimer=null;
function render(focus){
  const map={home:vHome,results:vResults,detail:vDetail,travellers:vTravellers,review:vReview,ticket:vTicket,trips:vTrips,live:vLive,profile:vProfile};
  $('#main').innerHTML=map[S.view]();header();$('#fab').hidden=S.view==='home';
  if(focus){window.scrollTo(0,0);const h=$('#h1');(h||$('#main')).focus({preventScroll:true})}
  clearInterval(liveTimer);clearInterval(cdTimer);
  if(S.view==='live'&&!A.calm&&!A.focus)liveTimer=setInterval(()=>{S.liveF=Math.min(.95,(S.liveF||.55)+.01);const m=$('#map');if(m){const t=m.querySelector('.mtop').outerHTML;m.innerHTML=mapSVG()+t}},1500);
  if(S.tk&&S.tk.state==='scheduled')cdTimer=setInterval(()=>{const e=$('#cd');if(e)e.textContent=cd()},1000);
}
const TOP=['home','trips','live','profile'];
function go(v,focus=true){if(TOP.includes(v))S.stack=[];else if(S.view!==v)S.stack.push(S.view);S.view=v;render(focus);
  announce({home:'Book tickets',results:`Trains from ${S.from} to ${S.to}`,detail:'Train details',travellers:'Choose travellers',review:'Review and pay',ticket:'Booking confirmed',trips:'My trips',live:'Where’s my train',profile:'Your account'}[v])}
function back(){S.view=S.stack.pop()||'home';render(true)}
function requireAuth(next){if(S.auth)return next();signinDialog(next)}
function finishSignin(){S.auth=true;closeLayer();toast('Signed in as Priya');const n=S.afterSignin;S.afterSignin=null;if(n)n();else render(false)}
function book(){
  const t=totals(),x=t.x,s=t.s;
  S.lastBooking={kind:s.kind,name:x.name,no:x.no,dep:x.dep[0],depSt:x.dep[1],depD:dd(S.date,x.dep[3]),arr:x.arr[0],arrSt:x.arr[1],arrD:dd(S.date,x.arr[3]),dur:durLong(x.mins),cls:CLS[S.selCls][0],st:s.kind==='wl'?`Waitlist ${s.n}`:'Confirmed',p:s.p,
    pax:S.pax.map((id,i)=>{const p=person(id);const pref=S.quota==='SS'?'Lower':S.berth[id]||(eligSS(p)?'Lower':'');return{n:p.name,b:s.kind==='wl'?`Waitlist ${s.n+i}`:`Coach B3 · Berth ${33+i} · ${pref&&pref!=='No preference'?pref:['Lower','Middle','Upper'][i%3]}`}})};
  S.trips.unshift({kind:s.kind==='wl'?'wl':'cnf',name:x.name,no:x.no,route:`${S.from} → ${S.to}`,date:fd(DAYS[S.date]),cls:S.selCls,st:S.lastBooking.st,p:s.p,hist:s.kind==='wl'?[['Today',`Booked at Waitlist ${s.n}`]]:[]});
  S.stack=[];S.view='ticket';render(true);announce('Booking confirmed');
}
function runTatkal(mode){
  const tk=S.tk;tk.state='running';tk.log=[];render(false);
  const steps=[['09:55','ID and payment approval ready'],['09:59','In the fair queue · verified travellers only'],['10:00:00','Window open · requesting seats']];
  if(mode==='ok'){if(tk.backup){steps.push(['10:00:02',`${tk.first.name} is full. Trying backup.`]);steps.push(['10:00:04',`✓ ${tk.backup.name} · ${CLS[tk.cls][0]} confirmed`])}else steps.push(['10:00:03',`✓ ${tk.first.name} · ${CLS[tk.cls][0]} confirmed`]);steps.push(['10:00:05','Paid by UPI Autopay · ticket sent'])}
  else{steps.push(['10:00:02',`${tk.first.name} is full`]);if(tk.backup)steps.push(['10:00:04',`${tk.backup.name} is full`]);steps.push(['10:00:05','No seat this time · ₹0 charged'])}
  steps.forEach((s,i)=>setTimeout(()=>{tk.log.push(s);if(i===steps.length-1){tk.state=mode==='ok'?'booked':'failed';if(mode==='ok'){const w=tk.backup||tk.first;S.trips.unshift({kind:'cnf',name:w.name,no:w.no,route:'Bengaluru → Patna',date:fd(TK.travel),cls:tk.cls,st:'Confirmed · Tatkal',p:99})}}if(S.view==='trips')render(false);announce(s[1])},350+i*700));
}

/* accessibility */
const A=Object.assign({size:1,theme:'auto',readable:false,spacing:false,calm:false,focus:false,speak:false,lang:0},(()=>{try{return JSON.parse(localStorage.getItem('irctc-a11y'))||{}}catch(e){return{}}})());
function applyA(){const r=document.documentElement;r.style.setProperty('--fs',[14,16,18,21][A.size]+'px');if(A.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',A.theme);['readable','spacing','calm','focus'].forEach(k=>r.classList.toggle(k,!!A[k]));try{localStorage.setItem('irctc-a11y',JSON.stringify(A))}catch(e){}}
function a11yDrawer(){dialog(`<div class="between"><h2>Make it easier to use</h2><button class="xbtn" data-close aria-label="Close">${I.x}</button></div>${a11yPanel()}`,'Accessibility',true)}
function refreshA(sel){if($('#layer .drawer'))a11yDrawer();else render(false);const el=$(sel);el&&el.focus()}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(b.id!=='tourbtn'&&!b.closest('#tourpop'))tourPop(false);
  if(b.id==='tourbtn'){tourPop(b.getAttribute('aria-expanded')!=='true');return}
  if(d.tour){tourPop(false);tour(d.tour);return}
  if(b.id==='fab'||'voice' in d){openVoice();return}
  if(d.nav){closeLayer();go(d.nav);return}
  if('a11y' in d){a11yDrawer();return}
  if('lang' in d){A.lang=A.lang?0:1;applyA();toast(A.lang?'हिंदी चुनी गई · full translation in the real site':'English selected');return}
  if('close' in d){closeLayer();if($('#gc'))render(false);return}
  if('soon' in d){toast('Not part of this prototype');return}
  if('back' in d){back();return}
  if(d.signin){const k=d.signin;if(k==='dialog'){signinDialog();return}if(k==='new'){newUserDialog(1);return}if(k==='otp'){closeLayer();toast('OTP sent to +91 98••• ••210 (demo)');setTimeout(finishSignin,900);return}if(k==='skip'){finishSignin();return}faceID('Signing in as Priya',finishSignin);return}
  if(d.newstep){newUserDialog(2);return}
  if(d.gcount){S.guestCount=Math.max(1,Math.min(6,S.guestCount+ +d.gcount));$('#gc').textContent=S.guestCount;return}
  if(d.quota){S.quota=d.quota;if(S.quota==='TQ')S.date=TK.idx;render(false);$(`[data-quota="${d.quota}"]`).focus();announce(QHELP[S.quota]);return}
  if(d.quickquota){S.quota=d.quickquota;S.date=TK.idx;render(false);$('#searchForm').scrollIntoView({block:'center'});$(`[data-quota="TQ"]`).focus();return}
  if(d.setquota){S.quota=d.setquota;if(S.quota==='TQ')S.date=TK.idx;closeLayer();render(false);return}
  if('quotadlg' in d){quotaDialog();return}
  if(d.go){if(d.mode)S.flowMode=d.mode;closeLayer();go(d.go);return}
  if(d.date){S.date=+d.date;render(false);$(`[data-date="${d.date}"]`).focus();return}
  if(d.rtab){S.rtab=d.rtab;render(false);$(`[data-rtab="${d.rtab}"]`).focus();return}
  if(d.cls){S.cls=d.cls;render(false);$(`[data-cls="${d.cls}"]`).focus();return}
  if(d.open){if('forcegn' in d){S.quota='GN';S.date=TK.idx;S.cls='3A'}S.sel=d.open;S.selCls=null;go('detail');return}
  if(d.selcls){S.selCls=d.selcls;render(false);$(`[data-selcls="${d.selcls}"]`).focus();return}
  if('book' in d){requireAuth(()=>{S.flowMode='book';go('travellers')});return}
  if('tatkal' in d){requireAuth(()=>{S.tkBackup=true;S.tkMax=null;tatkalDrawer()});return}
  if('tkschedule' in d){const m=+$('#tkMax').value||0,k=S._tk;closeLayer();faceID('Approving UPI Autopay up to '+R(m),()=>{S.tk={state:'scheduled',first:k.x,backup:k.bk,cls:k.c,n:k.n,max:m,log:[]};toast('Scheduled. We’ll message you at 10:00.');go('trips')});return}
  if(d.tkrun){runTatkal(d.tkrun);return}
  if(d.pax){togglePax(d.pax);return}
  if('addpax' in d){addPaxDialog();return}
  if('paxdone' in d){const m=S.flowMode;if(m==='tatkal'){back();setTimeout(tatkalDrawer,60);return}if(m==='pick'||m==='review'){back();return}go('review');return}
  if('pay' in d){const t=totals();faceID('Paying '+R(t.sum)+' with UPI',book);return}
  if('signout' in d){S.auth=false;S.tk=null;go('home');return}
  if(d.asize){A.size=+d.asize;applyA();refreshA(`[data-asize="${d.asize}"]`);return}
  if(d.atheme){A.theme=d.atheme;applyA();refreshA(`[data-atheme="${d.atheme}"]`);return}
  if(d.alang){A.lang=+d.alang;applyA();refreshA(`[data-alang="${d.alang}"]`);if(A.lang)toast('Full translation is part of the real site');return}
  if('areset' in d){Object.assign(A,{size:1,theme:'auto',readable:false,spacing:false,calm:false,focus:false,speak:false,lang:0});applyA();refreshA('[data-areset]');return}
  if(d.vsay){const sg=$('#vsugg');if(sg)sg.hidden=true;if(voiceRec){try{voiceRec.stop()}catch(e){}}typeOut(d.vsay,()=>handleSpeech(d.vsay));return}
  if(d.vgo){const [k,id]=d.vgo.split(':');closeLayer();
    if(k==='live'||k==='trips'){go(k);return}
    S.stack=['home'];if(k==='results'){S.view='results';render(true);return}
    S.stack=['home','results'];S.sel=id;S.selCls=S.cls;S.view='detail';render(true);
    if(k==='tatkal'){S.tkBackup=true;S.tkMax=null;setTimeout(tatkalDrawer,80)}return}
  if(b.id==='swap'){[S.from,S.to]=[S.to,S.from];render(false);$('#swap').focus();return}
  if(b.id==='paxPick'){if(S.auth){S.flowMode='pick';go('travellers')}else guestPaxDialog();return}
});
function togglePax(id){const p=person(id),q=S.quota;if(!S.pax.includes(id)&&((q==='SS'&&!eligSS(p))||(q==='LD'&&!eligLD(p)))){announce(`${p.name} doesn’t qualify for this booking type`);toast(`${p.name.split(' ')[0]} doesn’t qualify for ${QSHORT[q]}`);return}
  S.pax=S.pax.includes(id)?S.pax.filter(x=>x!==id):[...S.pax,id];render(false);const el=$(`[data-pax="${id}"]`);el&&el.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#layer').innerHTML)closeLayer();tourPop(false)}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a){A[el.dataset.a]=el.checked;applyA();if(el.dataset.a==='focus'||el.dataset.a==='calm')refreshA(`[data-a="${el.dataset.a}"]`);return}
  if(el.dataset.opt){S.opts[el.dataset.opt]=el.checked;if(el.dataset.opt==='ins'){render(false);$('[data-opt="ins"]').focus()}return}
  if(el.dataset.berth){S.berth[el.dataset.berth]=el.value;render(false);$(`#b-${el.dataset.berth}`).focus();return}
  if(el.id==='tkB'){S.tkBackup=el.checked;S.tkMax=null;tatkalDrawer();$('#tkB').focus();return}
  if(el.id==='tkMax'){S.tkMax=+el.value;return}
  if(el.id==='sort'){S.sort=el.value;render(false);$('#sort').focus();return}
  if(el.id==='date'){S.date=+el.value;return}
  if(el.id==='from'||el.id==='to'){const v=el.value.trim();const c=ALIAS[v.toLowerCase()]||(CITY[v]?v:null);if(c)S[el.id]=c;return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='searchForm'){if(!(S.from==='Bengaluru'&&S.to==='Patna')){toast('Sample data covers Bengaluru → Patna');S.from='Bengaluru';S.to='Patna'}S.rtab='all';go('results')}
  if(f.id==='addPax'){const n=$('#apName').value.trim(),a=+$('#apAge').value;if(!n||!a){toast('Add a name and age');return}const id='p'+Date.now();PEOPLE.push({id,name:n,rel:$('#apRel').value,age:a,g:$('#apG').value});if(S.view==='travellers')S.pax.push(id);closeLayer();render(false);toast(`${n} saved`)}
  if(f.id==='vform'){const v=$('#vtext').value.trim();if(v){$('#vsaid').textContent=v;handleSpeech(v)}}
  if(f.id==='pnrForm'){$('#pnrOut').innerHTML=`<div class="infoline" role="status">${I.info}<span><b>Telangana Express · 12724</b><br>Waitlist 5 · 82% chance to confirm · Sun, 8 Nov</span></div>`}
  if(f.id==='liveSearch'){toast('Showing 12724 · sample data')}
});
function tour(k){
  closeLayer();S.stack=[];
  const reset=()=>{S.from='Bengaluru';S.to='Patna';S.rtab='all';S.sort='best';S.quota='GN';S.date=1;S.pax=['me'];S.berth={}};
  if(k==='welcome'){S.auth=false;S.tk=null;reset();go('home');toast('You’re browsing as a guest. Find trains, then Book to see sign-in.');return}
  S.auth=true;
  if(k==='connecting'){reset();S.rtab='conn';S.stack=['home'];S.view='results';render(true);return}
  if(k==='waitlist'){reset();S.stack=['home','results'];S.sel='san';S.selCls='3A';S.view='detail';render(true);return}
  if(k==='senior'){reset();S.quota='SS';S.pax=['mom','dad'];S.stack=['home'];S.view='results';render(true);return}
  if(k==='tatkal'){reset();S.quota='TQ';S.date=TK.idx;S.pax=['me','dad'];S.stack=['home','results'];S.sel='san';S.selCls='3A';S.view='detail';render(true);S.tkBackup=true;S.tkMax=null;setTimeout(tatkalDrawer,120);return}
  if(k==='live'){go('live');return}
  if(k==='voice'){go('home');setTimeout(openVoice,100);return}
  if(k==='a11y'){go('profile');return}
}
$('#fab .m').innerHTML=I.wave;
applyA();render(false);
</script>
